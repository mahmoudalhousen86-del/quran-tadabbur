<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تدبّر القرآن</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  background: #f2f4f7;
  margin: 0;
  padding: 15px;
}
header {
  background: #1e40af;
  color: white;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 15px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}
.ayah {
  font-size: 20px;
  line-height: 1.9;
}
.meta {
  font-size: 14px;
  color: #555;
}
button {
  width: 100%;
  padding: 12px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<header>
  <h2>📖 تدبّر القرآن</h2>
  <p>نظام يومي – صفحة واحدة</p>
</header>

<div class="card">
  <div class="ayah">
    ﴿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ﴾
  </div>
  <p><b>التفسير:</b> أبدأ كل عمل مستعينًا بالله.</p>
  <p class="meta">
    📍 النوع: مكية<br>
    ⏳ زمن النزول: قبل الهجرة<br>
    📜 سبب النزول: افتتاح القرآن
  </p>
</div>

<div class="card">
  <h3>🌙 وقفة إيمانية</h3>
  <p>ابدأ يومك بالله… تتغير نيتك قبل عملك.</p>
</div>

<div class="card">
  <h3>✅ تطبيق اليوم</h3>
  <p>سمِّ الله قبل أي عمل اليوم.</p>
</div>

<button onclick="alert('سيتم إضافة الصفحات لاحقًا')">
الصفحة التالية ➡️
</button>

</body>
</html>
